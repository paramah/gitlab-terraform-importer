[project]
name = "gitlab-terraform-importer"
version = "0.2.0"
description = "GitLab Terraform Importer with Clean Architecture - Import GitLab structure and generate Terraform configs"
authors = [
    {name = "Aleksander Cynarski",email = "aleksander@cynarski.pl"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-gitlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "gql[requests]>=3.5.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-hcl2>=4.3.0",
    "python-terraform>=0.10.0",
    "rich>=13.0.0",
]

[tool.poetry]
packages = [{include = "gitlab_terraform_importer", from = "src"}]

[project.scripts]
gitlab-tf-import = "gitlab_terraform_importer.interfaces.cli.commands:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

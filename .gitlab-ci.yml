image: python:3.13

# Define pipeline stages
stages:
  - lint
  - test
  - security
  - build
  - report

# Cache poetry dependencies between jobs
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_VERSION: "1.8.0"
  POETRY_HOME: "$CI_PROJECT_DIR/.poetry"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

cache:
  key: "${CI_COMMIT_REF_SLUG}-${CI_JOB_NAME}"
  paths:
    - .cache/pip
    - .cache/pypoetry
    - .venv

# Install dependencies template
.install-dependencies: &install-dependencies
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install poetry==${POETRY_VERSION}
    - poetry --version
    - poetry config virtualenvs.in-project true
    - poetry install --no-interaction --no-ansi

# Lint job - check code formatting and style
lint:black:
  stage: lint
  <<: *install-dependencies
  script:
    - poetry run black --check src/ tests/
  allow_failure: false

lint:ruff:
  stage: lint
  <<: *install-dependencies
  script:
    - poetry run ruff check src/ tests/
  allow_failure: false

# Type checking
type-check:mypy:
  stage: lint
  <<: *install-dependencies
  script:
    - poetry run mypy src/gitlab_terraform_importer --ignore-missing-imports
  allow_failure: true

# Test jobs - run tests on different Python versions
test:python3.13:
  stage: test
  image: python:3.13
  <<: *install-dependencies
  script:
    - poetry run pytest tests/ -v --cov=src/gitlab_terraform_importer --cov-report=xml --cov-report=html --cov-report=term
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    name: "coverage-report-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - htmlcov/
      - coverage.xml
      - .coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days
    when: always

test:python3.14:
  stage: test
  image: python:3.14-rc
  <<: *install-dependencies
  script:
    - poetry run pytest tests/ -v --cov=src/gitlab_terraform_importer --cov-report=term
  allow_failure: true
  when: manual

# Security scanning
security:safety:
  stage: security
  <<: *install-dependencies
  script:
    - poetry export -f requirements.txt --output requirements.txt --without-hashes
    - pip install safety
    - safety check --file requirements.txt --ignore 70612 || true
  allow_failure: true
  artifacts:
    paths:
      - requirements.txt
    expire_in: 7 days

security:bandit:
  stage: security
  <<: *install-dependencies
  script:
    - pip install bandit
    - bandit -r src/ -f json -o bandit-report.json || true
    - bandit -r src/ -f txt
  allow_failure: true
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 7 days

# Build package
build:package:
  stage: build
  <<: *install-dependencies
  script:
    - poetry build
    - ls -lh dist/
  artifacts:
    name: "dist-packages-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 30 days
  only:
    - main
    - develop
    - tags
    - merge_requests

# Generate test report
report:coverage:
  stage: report
  image: python:3.13
  dependencies:
    - test:python3.13
  script:
    - pip install coverage
    - coverage report
    - coverage html
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    name: "final-coverage-report-${CI_COMMIT_SHORT_SHA}"
    paths:
      - htmlcov/
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Pages job - publish coverage report to GitLab Pages
pages:
  stage: report
  dependencies:
    - test:python3.13
  script:
    - mkdir -p public
    - cp -r htmlcov/* public/
    - echo "<html><head><meta http-equiv='refresh' content='0; url=index.html'></head></html>" > public/index.html
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main

# Integration test (manual)
integration:test:
  stage: test
  <<: *install-dependencies
  script:
    - echo "Running integration tests..."
    - poetry run gitlab-importer --help
    - poetry run gitlab-importer validate-config || true
  when: manual
  allow_failure: true

# Release job (manual) - only on tags
release:pypi:
  stage: build
  <<: *install-dependencies
  script:
    - poetry config pypi-token.pypi $PYPI_TOKEN
    - poetry publish --build
  only:
    - tags
  when: manual
  allow_failure: true
